[project]
name = "roundtrip-speech"
version = "0.1.0"
description = "Generates, transcribes and evaluates Roundtrip audio with open speech models, run in the Codespace."
requires-python = ">=3.12,<3.14"
dependencies = []

[dependency-groups]
dev = ["pytest>=9.1"]
# Installed only in the Codespace (CPU builds): uv sync --group models
models = [
  "torch>=2.8",
  "torchaudio>=2.8",
  "transformers>=4.57",
  "soundfile>=0.13",
  "numpy>=2.2",
  "sentencepiece>=0.2",
  "huggingface_hub>=0.35",
  # An ffmpeg binary for loudness normalization and MP3 encoding when the system has none.
  "imageio-ffmpeg>=0.6",
]

[tool.uv]
package = false
default-groups = ["dev"]

# CPU-only PyTorch on Linux: the default wheels pull in several GB of CUDA libraries the
# Codespace can't use. https://docs.astral.sh/uv/guides/integration/pytorch/
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
