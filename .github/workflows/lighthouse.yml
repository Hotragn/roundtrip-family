name: Lighthouse on the live site

# Mobile Lighthouse against the deployed demo, from a clean runner, five runs per page. The
# scores go to the run's summary and the reports are kept for a week. Run it after a deploy
# (Actions, Lighthouse on the live site); "pages" narrows it, "traces" keeps each run's trace.
on:
  workflow_dispatch:
    inputs:
      pages:
        description: Pages to measure
        default: / /plan/fremont-demo /parents/fremont-demo/p_sarala /parents/munich-demo/p_kamala
      traces:
        description: Keep each run's trace
        type: boolean
        default: false

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wake the instance
        run: curl -fsS --max-time 90 -o /dev/null https://roundtrip-web.onrender.com/api/health
      - name: Run Lighthouse
        env:
          PAGES: ${{ inputs.pages }}
          TRACES: ${{ inputs.traces }}
        run: |
          base=https://roundtrip-web.onrender.com
          extra=""; [ "$TRACES" = "true" ] && extra="--save-assets"
          echo "| Page | Run | Performance | Accessibility | Best practices | SEO | FCP | LCP | Speed Index | TBT | CLS |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|---|---|---|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p reports
          for page in $PAGES; do
            for run in 1 2 3 4 5; do
              name="reports/$(echo "$page" | tr '/' '_')-$run"
              npx -y lighthouse@12 "$base$page" --output=json --output-path="$name.json" --quiet $extra \
                --chrome-flags="--headless=new --no-sandbox" > /dev/null 2>&1 || true
              node -e '
                const r = require(process.argv[1]), c = r.categories;
                const s = (k) => Math.round(c[k].score * 100);
                const ms = (k) => Math.round(r.audits[k].numericValue);
                const cls = r.audits["cumulative-layout-shift"].numericValue.toFixed(3);
                console.log(`| ${process.argv[2]} | ${process.argv[3]} | ${s("performance")} | ${s("accessibility")} | ${s("best-practices")} | ${s("seo")} | ${ms("first-contentful-paint")} | ${ms("largest-contentful-paint")} | ${ms("speed-index")} | ${ms("total-blocking-time")} | ${cls} |`);
              ' "./$name.json" "$page" "$run" | tee -a "$GITHUB_STEP_SUMMARY"
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: reports/
          retention-days: 7
