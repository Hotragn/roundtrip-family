name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI never calls paid or rate-limited APIs: model calls replay from data/demo/llm-cache,
# searches from fixtures, and email goes to a mocked client.
env:
  CI: "true"
  LLM_MODE: replay

jobs:
  typescript:
    name: Lint, types, tests, privacy, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        id: lint
        run: pnpm lint
      - name: Type check
        id: types
        run: pnpm typecheck
      - name: Unit tests and evals
        id: tests
        run: pnpm test -- --reporter=default --reporter=json --outputFile=test-results/vitest.json
      - name: Privacy check
        id: privacy
        run: pnpm privacy-check
      - name: Build the web app
        id: build
        run: pnpm build
      - name: Summary
        if: always()
        run: |
          {
            echo "## Roundtrip CI"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Lint | ${{ steps.lint.outcome }} |"
            echo "| Type check | ${{ steps.types.outcome }} |"
            echo "| Unit tests and evals | ${{ steps.tests.outcome }} |"
            echo "| Privacy check | ${{ steps.privacy.outcome }} |"
            echo "| Web build | ${{ steps.build.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f test-results/vitest.json ]; then
            node -e '
              const r = require("./test-results/vitest.json");
              const lines = ["", "| Test file | Passed | Failed |", "|---|---|---|"];
              for (const f of r.testResults) {
                const pass = f.assertionResults.filter(a => a.status === "passed").length;
                const fail = f.assertionResults.filter(a => a.status === "failed").length;
                lines.push(`| ${f.name.split("/roundtrip-family/").pop()} | ${pass} | ${fail} |`);
              }
              lines.push("", `**${r.numPassedTests} passed, ${r.numFailedTests} failed, ${r.numPendingTests} skipped**`);
              require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            '
          fi

  python:
    name: Python tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [ranker, speech, finetune]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tests
        working-directory: ${{ matrix.project }}
        run: uv run pytest -q
      - name: Leave-one-out eval (replays recorded TabPFN responses)
        if: matrix.project == 'ranker'
        working-directory: ranker
        run: |
          uv run python eval_loo.py --area fremont --mode replay | tee loo.txt
          { echo "## Ranker leave-one-out (synthetic)"; echo ""; sed -n '/^| Features/,/^$/p' loo.txt; } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: Parents' app offline, accessibility and bundle (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the web app
        run: pnpm build
      - name: Install Chromium
        run: pnpm --filter @roundtrip/web exec playwright install --with-deps chromium
      - name: Offline, accessibility and bundle checks
        id: e2e
        run: pnpm --filter @roundtrip/web exec playwright test e2e/offline.spec.ts e2e/a11y.spec.ts e2e/dashboard.spec.ts e2e/scroll-track.spec.ts
      - name: Summary
        if: always()
        run: |
          f=apps/web/test-results/e2e.json
          {
            echo "## Parents' app end to end"
            echo ""
            echo "Result: ${{ steps.e2e.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$f" ]; then
            node -e '
              const r = require("./" + process.argv[1]);
              const rows = [];
              const walk = (s) => { for (const x of s.suites ?? []) walk(x); for (const sp of s.specs ?? []) for (const t of sp.tests) rows.push([sp.title, t.results.at(-1)?.status ?? "skipped"]); };
              walk(r);
              const lines = ["", "| Test | Result |", "|---|---|", ...rows.map(([a, b]) => `| ${a} | ${b} |`)];
              require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            ' "$f"
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7
